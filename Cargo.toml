[workspace]
resolver = "2"
members = [
    "crates/abi",
    "crates/rvcore",
    "crates/jobfmt",
    "crates/worker",
    "crates/jobkit",
    "crates/coordinator",
    "crates/difftest",
    "crates/conformance",
    "crates/contentstore",
    "crates/wire",
]
exclude = ["jobs/demo-hash/job", "jobs/conformance/job"]

[workspace.dependencies]
abi = { path = "crates/abi" }
rvcore = { path = "crates/rvcore" }
jobfmt = { path = "crates/jobfmt" }
contentstore = { path = "crates/contentstore" }
wire = { path = "crates/wire" }
worker = { path = "crates/worker" }
jobkit = { path = "crates/jobkit" }
blake3 = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rustls = { version = "0.23.45", features = ["ring"] }
rcgen = "0.13"

[workspace.package]
version = "0.1.0"
edition = "2021"
