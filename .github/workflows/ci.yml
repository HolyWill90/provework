name: ci

# The deterministic-runtime contract, enforced continuously:
# every push, the emulator must produce byte-identical chunk hash
# chains on three operating systems and two CPU architectures.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    # Docs/notebook-only changes skip the heavy suite: each job below
    # is skipped (not absent), so required checks report "skipped" and
    # satisfy branch protection.
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.f.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          CHANGED=$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "force-run")
          echo "changed files:"; echo "$CHANGED" | head -20
          if echo "$CHANGED" | grep -qE '\.(rs|toml|lock|S|ld|json|bin|yml|yaml)$|^\.github/|^arch-tests/|^jobs/|^elf/|^docker/'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: riscv64imac-unknown-none-elf

      - name: Build job ELFs (RISC-V)
        shell: bash
        run: |
          (cd jobs/demo-hash/job && cargo build --release)
          (cd jobs/agent-task/job && cargo build --release)
          cp jobs/demo-hash/job/target/riscv64imac-unknown-none-elf/release/demo-hash jobs/demo-hash/program.elf
          cp jobs/agent-task/job/target/riscv64imac-unknown-none-elf/release/agent-task jobs/agent-task/program.elf
          # Smoke job reuses the demo-hash program with a 32 KiB input so
          # the network tests execute seconds, not minutes, on CI.
          cp jobs/demo-hash/program.elf jobs/demo-hash-smoke/program.elf
          cp jobs/demo-hash/program.elf jobs/demo-hash-nano/program.elf

      - name: Unit tests (ISA + quorum + network integration)
        run: cargo test --workspace

      - name: SP1 execution path compiles (production tier; Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          cargo check -p worker --features sp1

      - name: Official riscv-tests tally (tohost)
        run: cargo run -p conformance -- arch arch-tests

      - name: Differential determinism (debug vs release on this OS)
        run: |
          cargo run --release -p difftest -- jobs/demo-hash --out-prefix demo-hash
          cargo run --release -p difftest -- jobs/demo-hash-smoke --out-prefix demo-hash-smoke

      - name: Stage result hashes with per-OS filenames
        shell: bash
        run: |
          cp target/demo-hash-release.json "demo-hash-release-${{ matrix.os }}.json"
          cp target/demo-hash-smoke-release.json "demo-hash-smoke-release-${{ matrix.os }}.json"

      - name: Upload result hashes for cross-platform comparison
        uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.os }}
          path: "*-release-${{ matrix.os }}.json"

  conformance:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Independent-implementation differential: the same static RISC-V
    # ELF executed by our emulator and by qemu-riscv64 must produce
    # byte-identical output.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: riscv64imac-unknown-none-elf

      - name: Build conformance job (RISC-V ELF)
        working-directory: jobs/conformance/job
        run: cargo build --release

      - name: Install job ELF into job directory
        run: cp jobs/conformance/job/target/riscv64imac-unknown-none-elf/release/conformance-isa jobs/conformance/program.elf

      - name: Run under our emulator
        run: cargo run --release -p conformance -- emu --elf jobs/conformance/program.elf --out target/conformance-emu.out

      - name: Run under QEMU and compare
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          qemu-riscv64 jobs/conformance/program.elf > target/conformance-qemu.out
          cargo run --release -p conformance -- compare target/conformance-emu.out target/conformance-qemu.out

      - name: Official riscv-tests tally (tohost, release)
        run: cargo run --release -p conformance -- arch arch-tests


  audit:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Dependency advisories: the RustSec database against Cargo.lock.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Install cargo-audit (pinned version)
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit dependencies
        run: cargo audit
        # Informational warnings do not fail; known vulnerabilities do.

  fuzz:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Panic/overflow/ASAN fuzzing of the untrusted-input surface: the
    # ELF parser, the result-format encoders, and the wire decoder.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned nightly date: floating nightly changes sanitizer
      # codegen independently of the repository.
      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-15
          components: rust-src
      - name: Install cargo-fuzz (pinned version)
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz the ELF parser
        run: cargo +nightly fuzz run fuzz_elf_parse -- -max_total_time=120 -rss_limit_mb=2560
      - name: Fuzz the job-format encoders
        run: cargo +nightly fuzz run fuzz_jobfmt -- -max_total_time=60
      - name: Fuzz the wire decoder
        run: cargo +nightly fuzz run fuzz_wire_frame -- -max_total_time=60
      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/

  zk-receipt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Re-verify the committed same-ELF SP1 receipt against the local
    # rvcore run: proves the checked-in artifacts still attest the
    # checked-in emulator and job, without needing a prover.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: riscv64imac-unknown-none-elf
      - name: Install protoc (sp1-prover-types build dependency)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      # The nano job ELF is a committed sealed artifact: the committed
      # receipt is bound to its exact bytes, so it is NOT rebuilt here
      # (the job ELF is not byte-deterministic across build hosts).
      - name: Build the zk verifier binary
        working-directory: sp1-host
        run: cargo build --release --bins
      - name: Debug binding inputs
        run: |
          sha256sum jobs/demo-hash-nano/job.json jobs/demo-hash-nano/program.elf jobs/demo-hash-nano/input.bin
          sha256sum sp1-artifacts/sp1-guest-emu.elf sp1-artifacts/nano-receipt.bin
      - name: Verify the committed nano receipt
        working-directory: sp1-host
        run: cargo run --release --bin emu -- verify ../jobs/demo-hash-nano ../sp1-artifacts/nano-receipt.bin ../sp1-artifacts/sp1-guest-emu.elf
      - name: End-to-end receipt claim over the wire
        env:
          P2PC_ZK_VERIFY: ${{ github.workspace }}/sp1-host/target/release/zk-verify
          P2PC_ZK_GUEST_ELF: ${{ github.workspace }}/sp1-artifacts/sp1-guest-emu.elf
        run: cargo test -p coordinator --test network zk_receipt_claim_accepts_job -- --nocapture

      - name: high-assurance proving queue with dedup (mock prover)
        # require_zk submission -> queued -> receipt-backed outcome;
        # a second identical submission is served from the cache after
        # the cached receipt re-verifies (exactly one proof for two
        # identical jobs).
        env:
          SP1_PROVER: mock
          P2PC_ZK_JUDGE_CMD: ${{ github.workspace }}/sp1-host/target/release/zk-judge
          P2PC_ZK_JUDGE_GUEST_ELF: ${{ github.workspace }}/elf/sp1-guest-emu
          P2PC_ZK_VERIFY: ${{ github.workspace }}/sp1-host/target/release/zk-verify
        run: cargo test -p coordinator --test network zk_proving_queue_end_to_end_with_dedup -- --nocapture

      - name: V2 (SP1-native) job through the proving queue (mock prover)
        env:
          SP1_PROVER: mock
          P2PC_ZK_JUDGE_CMD: ${{ github.workspace }}/sp1-host/target/release/zk-judge
          P2PC_ZK_JUDGE_GUEST_ELF: ${{ github.workspace }}/elf/sp1-guest-emu
          P2PC_ZK_VERIFY: ${{ github.workspace }}/sp1-host/target/release/zk-verify
        run: cargo test -p coordinator --test network zk_proving_queue_v2_native_job -- --nocapture

      - name: zk dispute judge over the wire (mock prover)
        # SP1_PROVER=mock runs the full judge state machine — execute,
        # binding check, rvcore cross-check, receipt "proof", verdict,
        # vindication, slashing — without a proving-sized memory
        # envelope. Real-prover runs live in the Linux proving
        # container (docs/DESIGN.md has the measured envelope).
        env:
          SP1_PROVER: mock
          P2PC_ZK_JUDGE_CMD: ${{ github.workspace }}/sp1-host/target/release/zk-judge
          P2PC_ZK_JUDGE_GUEST_ELF: ${{ github.workspace }}/elf/sp1-guest-emu
        run: cargo test -p coordinator --test network zk_judge_dispute_receipt_vindicates_honest_worker -- --nocapture

  coverage:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Line-coverage floor over the verification-critical crates, so
    # security-relevant code cannot silently lose its tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.4.7
      - name: Build job ELFs (the network tests skip without them, which
              would gut coverage)
        run: |
          (cd jobs/demo-hash/job && cargo build --release)
          cp jobs/demo-hash/job/target/riscv64imac-unknown-none-elf/release/demo-hash jobs/demo-hash/program.elf
          (cd jobs/agent-task/job && cargo build --release)
          cp jobs/agent-task/job/target/riscv64imac-unknown-none-elf/release/agent-task jobs/agent-task/program.elf
          cp jobs/demo-hash/program.elf jobs/demo-hash-smoke/program.elf
          cp jobs/demo-hash/program.elf jobs/demo-hash-nano/program.elf
      - name: Build the zk binaries (the zk-tier tests count toward
              coverage under the mock prover)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          (cd sp1-host && cargo build --release --bins)
      - name: Coverage floor — workspace
        # Per-crate floors would gate on package-isolated runs that
        # lose the coordinator integration tests' coverage and are
        # meaningless. The zk-tier tests run here under the mock
        # prover so the strong-tier code is counted, not skipped.
        env:
          SP1_PROVER: mock
          P2PC_ZK_JUDGE_CMD: ${{ github.workspace }}/sp1-host/target/release/zk-judge
          P2PC_ZK_JUDGE_GUEST_ELF: ${{ github.workspace }}/elf/sp1-guest-emu
          P2PC_ZK_VERIFY: ${{ github.workspace }}/sp1-host/target/release/zk-verify
        run: cargo llvm-cov --workspace --fail-under-lines 55

  cross-verify:
    needs: [test, changes]
    if: needs.changes.outputs.rust == 'true' && always() && needs.test.result == 'success'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform hashes
        uses: actions/download-artifact@v4
        with:
          pattern: hashes-*
          merge-multiple: true
          path: hashes

      - name: Assert chunk hash chains are identical across all platforms
        run: |
          python3 - <<'EOF'
          import json, glob, sys
          # Compare each JOB's results across platforms (the job name is
          # the filename prefix before the -release-<os> suffix).
          jobs = {}
          for f in glob.glob('hashes/*.json'):
              stem = f.rsplit('-release-', 1)[0]
              jobs.setdefault(stem, []).append(f)
          for stem, files in sorted(jobs.items()):
              assert len(files) >= 3, f"{stem}: expected 3 platforms, got {files}"
              ref = json.load(open(sorted(files)[0]))
              for f in sorted(files)[1:]:
                  other = json.load(open(f))
                  assert ref['chunk_hashes'] == other['chunk_hashes'], f"{f}: chunk chain differs!"
                  assert ref['result_hash'] == other['result_hash'], f"{f}: result hash differs!"
                  assert ref['output_hex'] == other['output_hex'], f"{f}: output differs!"
              print(f"CROSS-PLATFORM PASS: {stem}: {len(files)} platforms, {len(ref['chunk_hashes'])} chunks, result {ref['result_hash']}")
          EOF
